version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: flowforge_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-flowforge}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: flowforge_redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flowforge_api
    restart: unless-stopped
    command: >
      sh -c "alembic upgrade head && uvicorn backend.app.main:app --host 0.0.0.0 --port 8000"
    environment:
      ENVIRONMENT: production
      DEBUG: "false"
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flowforge}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      SECRET_KEY: ${SECRET_KEY:-flowforge_production_secure_secret_key_64_characters_hash_signature_token}
      CORS_ORIGINS: '["http://localhost:5173", "http://localhost:3000", "http://localhost:80"]'
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flowforge_worker
    restart: unless-stopped
    command: python -m backend.app.worker
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flowforge}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      WORKER_CONCURRENCY: 5
      SECRET_KEY: ${SECRET_KEY:-flowforge_production_secure_secret_key_64_characters_hash_signature_token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: flowforge_scheduler
    restart: unless-stopped
    command: python -m backend.app.scheduler_worker
    healthcheck:
      disable: true
    environment:
      ENVIRONMENT: production
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-flowforge}
      REDIS_URL: redis://redis:6379/0
      USE_REDIS_QUEUE: "true"
      SCHEDULER_CHECK_INTERVAL_SECONDS: 10
      SECRET_KEY: ${SECRET_KEY:-flowforge_production_secure_secret_key_64_characters_hash_signature_token}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: flowforge_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
